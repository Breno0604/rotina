name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js (LTS 22)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Reproducible install from the committed lockfile (package-lock.json).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Build-time env: Vite replaces import.meta.env.VITE_CONVEX_URL with
      # undefined when unset, which dead-code-eliminates the whole app into
      # a throwing stub (silent broken bundle). The URL below is the real
      # production backend (Convex cloud deployment), so the compile also
      # matches what Netlify ships — the artifact itself is not a deployment.
      - name: Production build
        env:
          VITE_CONVEX_URL: https://earnest-panther-236.convex.cloud
        run: npm run build
